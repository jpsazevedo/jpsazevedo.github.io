<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>José Pedro Azevedo · Projects</title>
  <meta name="description" content="Portfolio of José Pedro Azevedo, Senior Cyber Security Professional.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5 13.5 12 15 7-1.5 12-7.5 12-15V7z' fill='%233b9e80'/%3E%3Cpath d='m11 16 3.5 3.5L21 13' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8f7; --surface: #fff; --border: #d7e1dc; --text: #13201b; --text-2: #43544d; --muted: #6b7c75;
      --accent: #2b8a6d; --accent-soft: rgba(43,138,109,.12);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a100e; --surface: #121c19; --border: #22332d; --text: #e6f0ec; --text-2: #b3c4bd; --muted: #7d918a;
        --accent: #4cc497; --accent-soft: rgba(76,196,151,.12); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0a100e; --surface: #121c19; --border: #22332d; --text: #e6f0ec; --text-2: #b3c4bd; --muted: #7d918a;
      --accent: #4cc497; --accent-soft: rgba(76,196,151,.12); color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.6 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
    .wrap { width: 100%; max-width: 880px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .wrap { padding: 0 28px; } }
    header.wrap { padding-top: 72px; padding-bottom: 44px; }
    .kicker { font: 500 .8rem "JetBrains Mono", monospace; color: var(--accent); margin: 0 0 12px; }
    h1 { font: 700 clamp(2.2rem, 6vw, 3.2rem)/1.1 "Space Grotesk", sans-serif; letter-spacing: -.02em; margin: 0; }
    .lede { color: var(--text-2); font-size: 1.08rem; margin: 14px 0 0; max-width: 56ch; }
    .links { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; font-size: .92rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main.wrap { flex: 1; padding-bottom: 72px; }
    h2 { font: 500 .8rem "JetBrains Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 14px; }
    .grid { display: grid; gap: 14px; }
    @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--text); transition: border-color .15s, transform .15s; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); text-decoration: none; }
    .card h3 { font: 600 1.15rem "Space Grotesk", sans-serif; margin: 0; display: flex; justify-content: space-between; gap: 12px; }
    .card h3 span { color: var(--accent); }
    .card p { margin: 0; color: var(--text-2); font-size: .94rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
    .tags span { font-size: .74rem; padding: 2px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--text-2); }
    footer { border-top: 1px solid var(--border); padding: 22px 0; font: .8rem "JetBrains Mono", monospace; color: var(--muted); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="wrap">
    <p class="kicker">~/projects</p>
    <h1>José Pedro Azevedo</h1>
    <p class="lede">Senior Cyber Security Professional working across Governance, Risk &amp; Compliance and Security Architecture. A collection of my projects.</p>
    <div class="links">
      <a href="resume/">Resume</a>
      <a href="https://www.linkedin.com/in/jos%C3%A9-pedro-azevedo/" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="mailto:silvaze.jp@gmail.com">Email</a>
    </div>
  </header>

  <main class="wrap">
    <h2>Projects</h2>
    <div class="grid" id="projects"></div>
  </main>

  <footer>
    <div class="wrap">© <span id="year"></span> José Pedro Azevedo</div>
  </footer>

  <script>
    // Add new projects here. `path` is the project's subfolder in this repo.
    const PROJECTS = [
      {
        path: "resume/",
        title: "Interactive Resume",
        description: "My CV as an explorable site: a working terminal, a career trajectory from telecom to GRC, and a skills map that traces each skill back to the roles where I used it.",
        tags: ["HTML", "CSS", "JavaScript"],
      },
    ];
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    document.getElementById("projects").innerHTML = PROJECTS.map((p) => `
      <a class="card" href="${esc(p.path)}">
        <h3>${esc(p.title)}<span aria-hidden="true">→</span></h3>
        <p>${esc(p.description)}</p>
        <div class="tags">${p.tags.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
      </a>`).join("");
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
